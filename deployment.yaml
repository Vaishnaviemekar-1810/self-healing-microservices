apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: health-service

  template:
    metadata:
      labels:
        app: health-service

    spec:
      containers:
        - name: health-service
          image: self-healing-health-service:2.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3